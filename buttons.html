<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation Hub</title>

<style>
    body {
        margin: 0;
        background: #F7B7C3;
        font-family: Arial, Helvetica, sans-serif;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        color: #8B1E3F;
        animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: background 0.35s ease;
        opacity: 0; /* start invisible for animation */
    }

    /* Ultra-soft hover tint */
    .box:hover {
        background: rgba(255, 255, 255, 0.03);
    }

    .icon-wrapper {
        text-align: center;
        cursor: pointer;
        text-decoration: none;
        color: #8B1E3F;
    }

    svg {
        width: 90px;
        height: 90px;
        stroke: #8B1E3F;
        stroke-width: 3;
        fill: none;
        transition: transform 0.3s ease, stroke 0.3s ease;
    }

    .icon-wrapper:hover svg {
        transform: scale(1.15);
        stroke: #6A0F2E;
    }

    .label {
        margin-top: 12px;
        font-size: 20px;
        letter-spacing: 1px;
    }

    /* ----------------------------- */
    /* 💖✨ GIRLY‑TECH SLIDE-IN ANIMATIONS */
    /* ----------------------------- */

    /* HOME — slide from left */
    .slide-in-left {
        animation: slideLeft 1s ease-out forwards;
    }
    @keyframes slideLeft {
        from { transform: translateX(-120%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }

    /* PROJECTS — slide from right */
    .slide-in-right {
        animation: slideRight 1s ease-out forwards;
        animation-delay: 0.15s;
    }
    @keyframes slideRight {
        from { transform: translateX(120%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }

    /* RESUME — slide from bottom */
    .slide-in-up {
        animation: slideUp 1s ease-out forwards;
        animation-delay: 0.3s;
    }
    @keyframes slideUp {
        from { transform: translateY(120%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* CONTACT — slide from top */
    .slide-in-down {
        animation: slideDown 1s ease-out forwards;
        animation-delay: 0.45s;
    }
    @keyframes slideDown {
        from { transform: translateY(-120%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

</style>
</head>

<body>

    <!-- HOME -->
    <div class="box slide-in-left">
        <a href="index.html" class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <path d="M3 10L12 3L21 10V21H3V10Z" />
            </svg>
            <div class="label">Home</div>
        </a>
    </div>

    <!-- PROJECTS -->
    <div class="box slide-in-right">
        <a href="projects.html" class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <path d="M2 21L9 14" />
                <path d="M14 3L21 10" />
                <path d="M14 3L10 7L17 14L21 10" />
            </svg>
            <div class="label">Projects</div>
        </a>
    </div>

    <!-- RESUME -->
    <div class="box slide-in-up">
        <a href="resume.html" class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <rect x="4" y="3" width="16" height="18" rx="2"/>
                <line x1="8" y1="8" x2="16" y2="8"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
                <line x1="8" y1="16" x2="13" y2="16"/>
            </svg>
            <div class="label">Resume</div>
        </a>
    </div>

    <!-- CONTACT -->
    <div class="box slide-in-down">
        <a href="contact.html" class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M3 6L12 13L21 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 19L10 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 19L14 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="label">Contact</div>
        </a>
    </div>

</body>
</html>
